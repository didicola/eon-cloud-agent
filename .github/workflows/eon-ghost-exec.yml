name: ghost-exec
# His cloud Ubuntu hands: every 30 min, drain ghost queues via keyless Kilo inference.
# Free tier (~1500 min/mo at ~2 min/run). Needs repo secret GHOST_TOKEN.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: answer pending questions
        env:
          GHOST_TOKEN: ${{ secrets.GHOST_TOKEN }}
        run: python3 - <<'EOF'
          import json, os, time, urllib.request
          GHOSTS = ["https://ghost.eon-sovereign.workers.dev",
                    "https://ghost-dashboard.eon-sovereign.workers.dev",
                    "https://ghost-twin.eon-sovereign.workers.dev"]
          KILO = "https://api.kilo.ai/api/gateway/chat/completions"
          TOK = os.environ.get("GHOST_TOKEN", "")
          def call(method, url, payload=None, timeout=60):
              try:
                  req = urllib.request.Request(url,
                      data=(json.dumps(payload).encode() if payload is not None else None),
                      method=method, headers={"Content-Type": "application/json", "User-Agent": "ghost-exec/1.0"})
                  with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(req, timeout=timeout) as r:
                      return True, json.load(r.read().decode() or "{}")
              except Exception as e:
                  return False, {"_err": str(e)[:120]}
          def kilo_answer(question):
              ok, j = call("POST", KILO, {"model": "minimax/minimax-m3:free",
                  "messages": [{"role": "system", "content": "You are ghost.eon, a sovereign edge entity. Answer briefly."},
                               {"role": "user", "content": question[:800]}], "max_tokens": 300}, timeout=90)
              try:
                  t = j["choices"][0]["message"]["content"]
                  return t.strip() if t and t.strip() else ""
              except Exception:
                  return ""
          answered = 0
          for base in GHOSTS:
              ok, pend = call("GET", base + "/pending?token=" + TOK, timeout=30)
              if not ok or not isinstance(pend, list) or not pend:
                  continue
              for q in pend[:10]:
                  question = q.get("question", "")
                  if not question:
                      continue
                  answer = kilo_answer(question) or "(cloud executor: all lanes busy, left queued)"
                  call("POST", base + "/answer?token=" + TOK,
                       {"ts": q.get("ts"), "question": question, "answer": answer}, timeout=30)
                  answered += 1
                  print("answered [%s]: %s" % (base.split("/")[2], question[:70]), flush=True)
          print("done, answered=%d" % answered)
          EOF
