name: eon-snn-cloud-train
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Neural Web training job id"
        required: true
        default: "tr-cloud-001"
      epochs:
        description: "SNN epochs (cloud, cap 5)"
        required: false
        default: "2"
      stdp:
        description: "Apply STDP plasticity pass after training (1=yes, 0=no)"
        required: false
        default: "1"
      mesh_url:
        description: "Sovereign worker URL (default localhost for host-run)"
        required: false
        default: "http://127.0.0.1:8787"
  repository_dispatch:
    types: [snn-train]
  # NO 24h batch cron: EON-Dream now learns continuously in real-time.
  # Micro-training runs are dispatched by eon_realtime_learner.py (Speed-of-Light
  # Continuous Learning) the moment experiences land on the EON-Synapse bus.

jobs:
  snn-train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/workflows/snn-train.yml

      - name: Install SNN stack (cloud CPU)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet snntorch

      - name: Cache MNIST dataset
        uses: actions/cache@v4
        with:
          path: /tmp/eon-mnist
          key: eon-mnist-v1

      - name: Run SNN cloud trainer
        id: snn
        env:
          JOB_ID: ${{ github.event.inputs.job_id || 'tr-cloud-001' }}
          EPOCHS: ${{ github.event.inputs.epochs || '2' }}
          STDP: ${{ github.event.inputs.stdp || '1' }}
          MESH_URL: ${{ github.event.inputs.mesh_url || 'http://127.0.0.1:8787' }}
        run: |
          python3 workers/snn_cloud_trainer.py --epochs "$EPOCHS" --force-cloud --out /tmp/snn_cloud.json $( [ "$STDP" = "1" ] && echo --stdp )
          echo "snn_metrics=$(cat /tmp/snn_cloud.json | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"

      - name: Upload SNN metrics to Neural Web Worker
        run: |
          curl -s -X POST "$MESH_URL/api/training/jobs/$JOB_ID" \
            -H "Content-Type: application/json" \
            -d '{"worker":"gh-actions-ubuntu","step":1,"loss":0,"note":"cloud snn training","metrics":'"$(echo "$SNN" | jq -c .)"'}' \
            || echo "worker unreachable (expected on non-host runner); metrics saved to artifact"
        env:
          MESH_URL: ${{ github.event.inputs.mesh_url || 'http://127.0.0.1:8787' }}
          SNN: ${{ steps.snn.outputs.snn_metrics }}

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: snn-cloud-metrics
          path: |
            /tmp/snn_cloud.json
            /tmp/snn_cloud.weights.json
