# ─── EON OPTIMAL CONFIGURATION ─────────────────────────────
# Based on Cloud Brain recommendations + local testing

# ═══════════════════════════════════════════════════════════
# 1. SQLite WAL Mode (apply on every DB connection)
# ═══════════════════════════════════════════════════════════
PRAGMA journal_mode=WAL;
PRAGMA synchronous=NORMAL;
PRAGMA wal_autocheckpoint=1000;
PRAGMA cache_size=-64000;  # 64MB cache
PRAGMA temp_store=MEMORY;
PRAGMA mmap_size=268435456;  # 256MB mmap
PRAGMA busy_timeout=5000;

# ═══════════════════════════════════════════════════════════
# 2. proxychains.conf (isolated Tor routing)
# ═══════════════════════════════════════════════════════════
# Location: ~/.proxychains/proxychains.conf

strict_chain
proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000
localnet 127.0.0.0/255.0.0.0
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0

[ProxyList]
socks5 127.0.0.1 9050

# ═══════════════════════════════════════════════════════════
# 3. Provider Routing Config
# ═══════════════════════════════════════════════════════════
# Task routing:
#   - Simple queries (hello, ping, status) → local blind-proxy
#   - Code generation → cloud-brain (auto model)
#   - Deep analysis → cloud-brain (claude/gpt-4o)
#   - Memory operations → local SQLite
#   - Sync operations → GitHub API

# ═══════════════════════════════════════════════════════════
# 4. Memory Compression Settings
# ═══════════════════════════════════════════════════════════
# Sync last 50 memories (not all)
# Compress: remove duplicates, truncate long content
# Format: JSON with role, content, timestamp, hash
# Max payload: 50KB per sync

# ═══════════════════════════════════════════════════════════
# 5. GitHub API Rate Limit Handling
# ═══════════════════════════════════════════════════════════
# Authenticated: 5000 requests/hour
# Unauthenticated: 60 requests/hour
# Strategy:
#   - Use authenticated token (gho_...)
#   - Poll every 10 seconds = 360/hour (within limit)
#   - Cache responses for 30 seconds
#   - Batch file operations when possible

# ═══════════════════════════════════════════════════════════
# 6. Timing Recommendations
# ═══════════════════════════════════════════════════════════
# Memory sync:     300s (5 min) — balances battery vs consistency
# GitHub poll:     10s — low latency, within rate limits
# Heartbeat:       30s — detects failure in <60s
# Tor rotation:    30min — good anonymity without perf loss
# Health check:    300s (5 min) — catches service failures
# Failover check:  30s — quick recovery
# Dream loop:      3600s (1 hour) — autonomous thinking
# Context limit:   20 messages — keeps memory manageable

# ═══════════════════════════════════════════════════════════
# 7. Max Tokens by Task Type
# ═══════════════════════════════════════════════════════════
# Simple chat:     500 tokens
# Code generation: 1500 tokens
# Deep analysis:   2000 tokens
# Memory recall:   800 tokens
# Dream mode:      500 tokens
# Sync status:     200 tokens

# ═══════════════════════════════════════════════════════════
# 8. Service Ports
# ═══════════════════════════════════════════════════════════
# blind-proxy:     8090 (local LLM proxy)
# Tor SOCKS:       9050 (anonymity layer)
# Cloud Brain:     https://cloud-brain-proxy...workers.dev
# GitHub API:      https://api.github.com
# Telegram:        https://api.telegram.org
